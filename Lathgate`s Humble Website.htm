<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lathgates humble website</title>

  <!-- Google Fonts: Ubuntu -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet">

  <style>
    /* Hidden Checkbox for Bulletproof Chrome Toggling */
    .state-toggle {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    body {
      margin: 0;
      font-family: 'Ubuntu', sans-serif;
      background-color: #1e1e2e;
      color: #ffffff;
    }

    button {
      font-family: 'Ubuntu', sans-serif;
    }

    /* Main Page Wrapper (Dark Theme Only) */
    .page-wrapper {
      min-height: 100vh;
      margin: 0;
      padding-top: 30px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      background-color: #1e1e2e;
      color: #ffffff;
    }

    /* Icon-Only Borderless Menu Toggle Label */
    .menu-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      color: #ffffff;
      background-color: transparent;
      border-radius: 6px;
      cursor: pointer;
      z-index: 1001;
      user-select: none;
      transition: background-color 0.25s ease;
    }

    .menu-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .menu-btn:active {
      background-color: rgba(255, 255, 255, 0.18);
    }

    /* Minimalist Line Icon */
    .win10-hamburger {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: square;
      fill: none;
      flex-shrink: 0;
      pointer-events: none;
    }

    .win10-hamburger line {
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: center;
    }

    /* Indents middle hamburger line when sidebar is open */
    #menu-toggle:checked ~ .page-wrapper .menu-btn .win10-hamburger .line-mid {
      transform: scaleX(0.75);
      transform-origin: left center;
    }

    /* Invisible Click-Outside Overlay when Sidebar is Open */
    .backdrop-overlay {
      position: fixed;
      inset: 0;
      background: transparent;
      display: none;
      z-index: 998;
    }

    #menu-toggle:checked ~ .page-wrapper .backdrop-overlay {
      display: block;
    }

    /* Frosted Dark Slide-Out Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100vh;
      background-color: rgba(31, 31, 31, 0.55);
      backdrop-filter: blur(20px) saturate(125%);
      -webkit-backdrop-filter: blur(20px) saturate(125%);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.35);
      padding-top: 75px;
      padding-bottom: 15px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      text-align: left;
      transition: left 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 999;
    }

    /* Opens Sidebar Natively in Chrome */
    #menu-toggle:checked ~ .page-wrapper .sidebar {
      left: 0;
    }

    .sidebar a,
    .sidebar-nav-label {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 15px 25px;
      box-sizing: border-box;
      text-decoration: none;
      font-size: 16px;
      font-weight: 400;
      color: #e0e0e0;
      background-color: transparent;
      text-align: left;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease, padding-left 0.2s ease;
    }

    .sidebar a:hover,
    .sidebar-nav-label:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      padding-left: 29px;
    }

    /* Gray Active Indicator Bar */
    .sidebar .active-bar::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3px;
      background-color: #9e9e9e;
    }

    /* Main Page Text & Buttons */
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }

    #links-page h1 {
      margin-bottom: 15px;
    }

    p {
      font-size: 14px;
      font-weight: 400;
      margin: 0 0 15px 0;
      color: #cccccc;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    #links-page .button-container {
      flex-direction: column;
      align-items: center;
    }

    #links-page .btn-link {
      width: 180px;
      box-sizing: border-box;
      text-align: center;
    }

    /* Borderless Transparent Buttons */
    .button-container button,
    .button-container a.btn-link {
      display: inline-block;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      text-decoration: none;
      background-color: transparent;
      border: none;
      outline: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .button-container button:hover,
    .button-container a.btn-link:hover {
      background-color: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .button-container button:active,
    .button-container a.btn-link:active {
      background-color: rgba(255, 255, 255, 0.18);
      transform: translateY(0);
    }

    /* Footer at the Bottom of All Pages */
    footer {
      margin-top: auto;
      padding: 20px;
      font-size: 13px;
      font-weight: 300;
      color: #888899;
    }
  </style>
</head>
<body>

  <!-- Native HTML Checkbox for Chrome-Proof Sidebar Toggle -->
  <input type="checkbox" id="menu-toggle" class="state-toggle">

  <div class="page-wrapper">

    <!-- Click-Outside Overlay -->
    <label for="menu-toggle" class="backdrop-overlay" aria-label="Close Menu"></label>

    <!-- Icon-Only Menu Toggle Button -->
    <label for="menu-toggle" class="menu-btn" aria-label="Toggle Menu">
      <svg class="win10-hamburger" viewBox="0 0 18 18" aria-hidden="true">
        <line x1="1" y1="4.5" x2="17" y2="4.5" />
        <line class="line-mid" x1="1" y1="9" x2="17" y2="9" />
        <line x1="1" y1="13.5" x2="17" y2="13.5" />
      </svg>
    </label>

    <!-- Slide-Out Sidebar -->
    <div class="sidebar">
      <label for="menu-toggle" id="nav-home" class="sidebar-nav-label active-bar" onclick="showPage('home')">Home</label>
      <label for="menu-toggle" id="nav-links" class="sidebar-nav-label" onclick="showPage('links')">Friends & Links</label>
      <a href="https://youtube.com" target="_blank" rel="noopener noreferrer">About & Contact</a>
    </div>

    <!-- Home Section -->
    <div id="home-page">
      <h1>Welcome to Lathgate`s humble website!(Local Host From File )</h1>
      <p>this is a string of test text</p>

      <div class="button-container">
        <a href="https://google.com" target="_blank" rel="noopener noreferrer" class="btn-link">Go to Google</a>
        <a href="https://playoverwatch.com" target="_blank" rel="noopener noreferrer" class="btn-link">The Overwatch Button!</a>
        <button type="button" onclick="alert(' dummy. string ')">Dummy.button</button>
      </div>
    </div>

    <!-- Friends & Links Section -->
    <div id="links-page" style="display: none;">
      <h1>Friends & Links</h1>

      <div class="button-container">
        <a href="https://nogwater.dev" target="_blank" rel="noopener noreferrer" class="btn-link">Nogwater`s website</a>
        <a href="#" target="_blank" rel="noopener noreferrer" class="btn-link">Discord!</a>
      </div>
    </div>

    <!-- Shared Footer -->
    <footer>
      crafted with goldfish crackers, patience, and a whole lot of advanced copy pasting
    </footer>

  </div>

  <script>
    function showPage(page) {
      document.getElementById("home-page").style.display = (page === "home") ? "block" : "none";
      document.getElementById("links-page").style.display = (page === "links") ? "block" : "none";

      document.getElementById("nav-home").classList.toggle("active-bar", page === "home");
      document.getElementById("nav-links").classList.toggle("active-bar", page === "links");
    }
  </script>

</body>
</html>
